name: Build Jailed Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: /opt/theos
      ROOTLESS: 0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Theos and SDKs
        run: |
          # Install Theos if not already present
          if [ ! -d "/opt/theos" ]; then
            sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          fi
          
          # Clone official Theos SDKs repository safely
          if [ ! -d "/opt/theos/sdks" ]; then
            sudo git clone https://github.com/theos/sdks.git /opt/theos/sdks
          else
            sudo git -C /opt/theos/sdks pull
          fi
          
          # Fix permissions for runner user
          sudo chown -R $USER:staff /opt/theos

      - name: Install Dependencies
        run: |
          brew install ldid make

      - name: Inject Jinx Dependency for Makefile
        run: |
          # Makefile'ın aradığı DerivedData yolunu ve Jinx kaynak kodunu tam olarak oluşturuyoruz
          DERIVED_DIR="$HOME/Library/Developer/Xcode/DerivedData"
          TARGET_JINX_DIR="$DERIVED_DIR/Tweak-CI/SourcePackages/checkouts/Jinx"
          
          mkdir -p "$TARGET_JINX_DIR"
          
          # Jinx deposunu resmi adresinden doğrudan Makefile'ın işaret ettiği konuma klonluyoruz
          git clone https://github.com/checkra1n/Jinx.git "$TARGET_JINX_DIR" || true

      - name: Build Dylib (Jailed)
        working-directory: ./Tweak
        run: |
          make FINALPACKAGE=1

      - name: Prepare Artifact
        run: |
          mkdir -p ./output
          find ./Tweak -name "*.dylib" -exec cp {} ./output/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jailed-Dylib
          path: ./output/*.dylib
