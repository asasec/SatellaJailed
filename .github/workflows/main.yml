name: Build Jailed Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: /opt/theos
      ROOTLESS: 0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Theos and SDKs
        run: |
          # Install Theos if not already present
          if [ ! -d "/opt/theos" ]; then
            sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          fi
          
          # Clone official Theos SDKs repository safely
          if [ ! -d "/opt/theos/sdks" ]; then
            sudo git clone https://github.com/theos/sdks.git /opt/theos/sdks
          else
            sudo git -C /opt/theos/sdks pull
          fi
          
          # Fix permissions for runner user
          sudo chown -R $USER:staff /opt/theos

      - name: Install Dependencies
        run: |
          brew install ldid make

      - name: Resolve Swift Packages & Fix DerivedData Paths
        working-directory: ./Tweak
        run: |
          # Eğer bir Package.swift varsa Swift paketlerini indirip build alıyoruz ki DerivedData oluşsun
          if [ -f "Package.swift" ]; then
            swift package resolve
          fi
          
          # Makefile'ın aradığı DerivedData ve Jinx yolunu gerçek SPM cache konumuyla eşleştiriyoruz
          DERIVED_DIR="$HOME/Library/Developer/Xcode/DerivedData"
          mkdir -p "$DERIVED_DIR"
          
          # Swift SPM checkouts klasörünü Makefile'ın bulabileceği yapıya bağlıyoruz
          SPM_CHECKOUTS="$HOME/Library/Caches/org.swift.swiftpm/checkouts"
          if [ -d "$SPM_CHECKOUTS/Jinx" ]; then
            TARGET_SYNTH_DIR="$DERIVED_DIR/Tweak-Build/SourcePackages/checkouts/Jinx"
            mkdir -p "$TARGET_SYNTH_DIR"
            ln -s "$SPM_CHECKOUTS/Jinx" "$TARGET_SYNTH_DIR/Jinx" || true
          else
            # Eğer otomatik cache'de yoksa sahte/boş yapı yerine doğrudan build klasörüne taşıma yapabiliriz
            mkdir -p "$DERIVED_DIR/Tweak-Dummy/SourcePackages/checkouts/Jinx/Sources/Jinx"
          fi

      - name: Build Dylib (Jailed)
        working-directory: ./Tweak
        run: |
          make FINALPACKAGE=1

      - name: Prepare Artifact
        run: |
          mkdir -p ./output
          find ./Tweak -name "*.dylib" -exec cp {} ./output/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jailed-Dylib
          path: ./output/*.dylib
