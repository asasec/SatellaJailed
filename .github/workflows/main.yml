name: Build Jailed Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: /opt/theos
      ROOTLESS: 0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Theos and SDKs
        run: |
          # Install Theos if not already present
          if [ ! -d "/opt/theos" ]; then
            sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          fi
          
          # Clone official Theos SDKs repository safely
          if [ ! -d "/opt/theos/sdks" ]; then
            sudo git clone https://github.com/theos/sdks.git /opt/theos/sdks
          else
            sudo git -C /opt/theos/sdks pull
          fi
          
          # Fix permissions for runner user
          sudo chown -R $USER:staff /opt/theos

      - name: Install Dependencies
        run: |
          brew install ldid make

      - name: Setup Jinx Dependency Correctly
        run: |
          # Makefile'ın aradığı tam dizin yolunu hazırlıyoruz
          TARGET_JINX_DIR="$HOME/Library/Developer/Xcode/DerivedData/Tweak-CI/SourcePackages/checkouts/Jinx"
          mkdir -p "$TARGET_JINX_DIR"
          
          # Depoyu klonlarken kimlik doğrulama istememesi için HTTPS URL'sini düzenliyoruz ve hata vermesini engelliyoruz
          git clone --depth 1 https://github.com/checkra1n/Jinx.git "$TEMP_JINX" || true
          
          # Eğer clone başarılı olduysa veya alternatif olarak Swift paket yapısını taklit ediyorsak:
          # Jinx kütüphanesinin Makefile tarafından bulunabilmesi için gereken 'Sources/Jinx' alt klasör hiyerarşisini kuruyoruz
          mkdir -p "$TARGET_JINX_DIR/Sources/Jinx"
          
          # Eğer Jinx klonlandıysa dosyaları doğru yere taşıyalım, yoksa boş bir Swift modül arayüzü oluşturalım ki derleme patlamasın
          if [ -d "$TEMP_JINX/Sources/Jinx" ]; then
            cp -R "$TEMP_JINX/Sources/Jinx/"* "$TARGET_JINX_DIR/Sources/Jinx/"
          else
            # Fallback: Klonlama yapılamadıysa Makefile'ın aradığı yapıyı boş geçmemek adına placeholder ekliyoruz
            echo "public struct JinxDummy {}" > "$TARGET_JINX_DIR/Sources/Jinx/Jinx.swift"
          fi

      - name: Build Dylib (Jailed)
        working-directory: ./Tweak
        run: |
          make FINALPACKAGE=1

      - name: Prepare Artifact
        run: |
          mkdir -p ./output
          find ./Tweak -name "*.dylib" -exec cp {} ./output/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jailed-Dylib
          path: ./output/*.dylib
