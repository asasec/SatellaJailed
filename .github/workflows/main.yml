name: Build Jailed Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: /opt/theos
      ROOTLESS: 0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Theos and SDKs
        run: |
          if [ ! -d "/opt/theos" ]; then
            sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          fi
          if [ ! -d "/opt/theos/sdks" ]; then
            sudo git clone https://github.com/theos/sdks.git /opt/theos/sdks
          else
            sudo git -C /opt/theos/sdks pull
          fi
          sudo chown -R $USER:staff /opt/theos || true

      - name: Install Dependencies
        run: |
          brew install ldid make gh python3

      - name: Setup Jinx via Official Release Archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TEMP_DIR="/tmp/jinx_release"
          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"
          
          curl -L "$(gh release view -R Paisseon/Jinx --json zipballUrl --jq .zipballUrl)" -o "$TEMP_DIR/jinx.zip"
          unzip -q "$TEMP_DIR/jinx.zip" -d "$TEMP_DIR/"
          
          # Mutlak yoldan tarayarak install_jinx.py dosyasının bulunduğu dizini kesin olarak buluyoruz
          FOUND_FILE=$(find "$TEMP_DIR" -name "install_jinx.py" | head -n 1)
          if [ -z "$FOUND_FILE" ]; then
            echo "Error: install_jinx.py not found!"
            exit 1
          fi
          
          SCRIPT_DIR=$(dirname "$FOUND_FILE")
          cd "$SCRIPT_DIR"
          python3 install_jinx.py

      - name: Build Dylib (Jailed)
        working-directory: ./Tweak
        run: |
          make FINALPACKAGE=1

      - name: Prepare Artifact
        run: |
          mkdir -p ./output
          find ./Tweak -name "*.dylib" -exec cp {} ./output/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jailed-Dylib
          path: ./output/*.dylib
