name: Build Jailed Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: /opt/theos
      ROOTLESS: 0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Theos and SDKs
        run: |
          if [ ! -d "/opt/theos" ]; then
            sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          fi
          if [ ! -d "/opt/theos/sdks" ]; then
            sudo git clone https://github.com/theos/sdks.git /opt/theos/sdks
          else
            sudo git -C /opt/theos/sdks pull
          fi
          sudo chown -R $USER:staff /opt/theos || true

      - name: Install Dependencies
        run: |
          brew install ldid make gh

      - name: Fetch and Integrate Jinx Source Files Directly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TEMP_JINX="/tmp/JinxRepo"
          rm -rf "$TEMP_JINX"
          
          # Jinx reposunu emt branch'inden klonluyoruz
          gh repo clone Paisseon/Jinx "$TEMP_JINX" -- --branch emt --depth 1
          
          # SatellaJailed projesinin Tweak/Sources içerisine Jinx modülü olarak taşıyoruz
          mkdir -p ./Tweak/Sources/Jinx
          cp -R "$TEMP_JINX/Sources/Jinx/"* ./Tweak/Sources/Jinx/

      - name: Build Dylib (Jailed)
        working-directory: ./Tweak
        run: |
          make FINALPACKAGE=1

      - name: Prepare Artifact
        run: |
          mkdir -p ./output
          find ./Tweak -name "*.dylib" -exec cp {} ./output/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jailed-Dylib
          path: ./output/*.dylib
