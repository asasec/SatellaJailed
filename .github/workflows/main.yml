name: Build Jailed Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: /opt/theos
      ROOTLESS: 0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Theos and SDKs
        run: |
          # Install Theos
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          
          # Clone official Theos SDKs repository
          sudo git clone https://github.com/theos/sdks.git /opt/theos/sdks
          
          # Fix permissions for runner user
          sudo chown -R $USER:staff /opt/theos

      - name: Install Dependencies
        run: |
          brew install ldid make

      - name: Build Dylib (Jailed)
        working-directory: ./Tweak
        run: |
          make

      - name: Prepare Artifact
        run: |
          mkdir -p ./output
          # Makefiles without package rules usually output the dylib directly in .theos/obj/ or similar, 
          # or we can grab it from the build output directory inside Tweak/.theos
          find ./Tweak -name "*.dylib" -exec cp {} ./output/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jailed-Dylib
          path: ./output/*.dylib
