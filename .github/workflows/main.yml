name: Build Jailed Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: /opt/theos
      ROOTLESS: 0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Theos and SDKs
        run: |
          if [ ! -d "/opt/theos" ]; then
            sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          fi
          if [ ! -d "/opt/theos/sdks" ]; then
            sudo git clone https://github.com/theos/sdks.git /opt/theos/sdks
          else
            sudo git -C /opt/theos/sdks pull
          fi
          # chown komutunun eksik/geçici kilit dosyaları yüzünden hata vermesini önlüyoruz
          sudo chown -R $USER:staff /opt/theos || true

      - name: Install Dependencies
        run: |
          brew install ldid make

      - name: Setup Jinx Dependency Correctly
        run: |
          DERIVED_DIR="$HOME/Library/Developer/Xcode/DerivedData"
          TARGET_JINX_DIR="$DERIVED_DIR/Tweak-CI/SourcePackages/checkouts/Jinx"
          TEMP_JINX="/tmp/JinxRepo"
          
          mkdir -p "$TARGET_JINX_DIR"
          rm -rf "$TEMP_JINX"
          
          curl -L https://github.com/checkra1n/Jinx/archive/refs/heads/main.zip -o /tmp/jinx.zip
          unzip -q /tmp/jinx.zip -d /tmp/
          mv /tmp/Jinx-main "$TEMP_JINX"
          
          mkdir -p "$TARGET_JINX_DIR/Sources/Jinx"
          
          if [ -d "$TEMP_JINX/Sources/Jinx" ]; then
            cp -R "$TEMP_JINX/Sources/Jinx/"* "$TARGET_JINX_DIR/Sources/Jinx/"
          else
            echo "public struct Jinx {" > "$TARGET_JINX_DIR/Sources/Jinx/Jinx.swift"
            echo "    public init() {}" >> "$TARGET_JINX_DIR/Sources/Jinx/Jinx.swift"
            echo "}" >> "$TARGET_JINX_DIR/Sources/Jinx/Jinx.swift"
          fi

      - name: Build Dylib (Jailed)
        working-directory: ./Tweak
        run: |
          make FINALPACKAGE=1

      - name: Prepare Artifact
        run: |
          mkdir -p ./output
          find ./Tweak -name "*.dylib" -exec cp {} ./output/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jailed-Dylib
          path: ./output/*.dylib
